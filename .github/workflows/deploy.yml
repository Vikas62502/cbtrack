name: CI/CD Pipeline

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cbtrack:latest .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/cbtrack:latest

      - name: Done
        run: echo "Image pushed to Docker Hub!"

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cbtrack:latest
            sudo docker stop cbtrack || true && sudo docker rm cbtrack || true
            sudo docker run -d \
              --name cbtrack \
              --restart unless-stopped \
              -p 3001:3000 \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e APP_URL=${{ secrets.APP_URL }} \
              -e ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} \
              -e CASHFREE_MOCK=${{ secrets.CASHFREE_MOCK }} \
              -e CASHFREE_ENV=${{ secrets.CASHFREE_ENV }} \
              -e CASHFREE_API_VERSION=${{ secrets.CASHFREE_API_VERSION }} \
              -e CASHFREE_APP_ID=${{ secrets.CASHFREE_APP_ID }} \
              -e CASHFREE_SECRET_KEY=${{ secrets.CASHFREE_SECRET_KEY }} \
              ${{ secrets.DOCKER_USERNAME }}/cbtrack:latest
